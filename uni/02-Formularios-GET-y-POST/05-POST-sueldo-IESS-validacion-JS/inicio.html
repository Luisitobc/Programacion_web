<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Sueldo</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="contenedor">

        <h1>Calculadora de Sueldo</h1>

        <form id="formulario" action="calcular.php" method="POST">

            <label for="nombre">Nombre del empleado:</label>
            <input type="text" id="nombre" name="nombre">

            <label for="sueldo">Sueldo básico:</label>
            <input type="number" id="sueldo" name="sueldo"
                   min="0" step="0.01">

            <label for="horasExtras">Horas extras:</label>
            <input type="number" id="horasExtras" name="horasExtras"
                   min="0">

            <label for="valorHora">Valor de cada hora extra:</label>
            <input type="number" id="valorHora" name="valorHora"
                   min="0" step="0.01">

            <label for="tipo">Tipo de empleado:</label>

            <select id="tipo" name="tipo">
                <option value="">Seleccione una opción</option>
                <option value="Administrativo">Administrativo</option>
                <option value="Tecnico">Técnico</option>
                <option value="Operativo">Operativo</option>
            </select>

            <button type="submit">Calcular sueldo</button>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
